```yaml
workflows:
  android-cliente-workflow:
    name: FINA-AUTO Cliente APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Instalar dependências e Compilar APK
        script: |
          cd fina_auto_cliente
          flutter packages pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/**/*.apk